<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zooniverse Engagement Slide</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .counter {
            font-size: 32px;
            margin: 20px 0;
        }
        canvas {
            max-width: 700px;
            margin: auto;
        }
    </style>
</head>
<body>

<h1>Zooniverse Engagement</h1>
<div class="counter" id="classifications">Total Classifications: Loading...</div>
<div class="counter" id="active_users">Active Users: Loading...</div>
<canvas id="trendChart"></canvas>

<script>
    // Chart setup
    const ctx = document.getElementById('trendChart').getContext('2d');
    const trendChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], // years or dates
            datasets: [
                { label: 'Total Classifications', data: [], borderColor: 'blue', fill: false },
                { label: 'Active Users', data: [], borderColor: 'green', fill: false }
            ]
        },
        options: {
            responsive: true,
            scales: {
                x: { display: true, title: { display: true, text: 'Year' } },
                y: { beginAtZero: true }
            }
        }
    });

    // Historical data CSV URL
    const csvURL = "https://username.github.io/repo-name/zooniverse_history.csv"; // replace with your CSV URL

    async function fetchHistoricalData() {
        const response = await fetch(csvURL);
        const text = await response.text();
        const rows = text.split("\n").slice(1); // skip header
        rows.forEach(row => {
            const [year, total, users] = row.split(",");
            trendChart.data.labels.push(year);
            trendChart.data.datasets[0].data.push(total);
            trendChart.data.datasets[1].data.push(users);
        });
        trendChart.update();
    }

    async function fetchLiveData() {
        try {
            const response = await fetch("https://panoptes.zooniverse.org/api/projects/1"); // replace with your project ID
            const data = await response.json();
            const project = data.projects[0];

            document.getElementById("classifications").textContent = 
                `Total Classifications: ${project.classifications_count}`;
            document.getElementById("active_users").textContent = 
                `Active Users: ${project.active_user_count}`;
        } catch (error) {
            console.error(error);
        }
    }

    fetchHistoricalData();
    fetchLiveData();
    setInterval(fetchLiveData, 60000); // refresh live stats every 60 seconds
</script>

</body>
</html>
